<style>

  .meme-float {

  .meme-card {
    position: absolute; left: 0; top: 0;

    display: block;

<script>
(function () {
  'use strict';

  const ALL_MEMES = [
    { src: '1.jpg',  alt: '请开始你的表演' },
    { src: '2.jpg',  alt: '来自达康的凝视' },
    { src: '3.jpg',  alt: '高兴到只剩下双眼皮' },
    { src: '4.jpg',  alt: '谁的眼神锁定我' },
    { src: '5.jpg',  alt: '高兴到模糊' },
    { src: '6.jpg',  alt: '你夸的人在这儿呐' },
    { src: '7.jpg',  alt: '下面我简单说两句' },
    { src: '8.webp', alt: '放学别跑' },
    { src: '9.jpg',  alt: '出来玩儿' },
    { src: '10.jpg', alt: 'show出你的苹果肌' },
    { src: '11.jpg', alt: '达康书记别低头GDP会掉' },
    { src: '12.jpg', alt: '老师我想进步了' },
    { src: '13.jpg', alt: '面壁思过' },
    { src: '14.jpg', alt: '你千万别拔腿就跑' }
  ];

  const LAYOUT_COUNT = 3;
  const CYCLE_INTERVAL = 6000;

  const bgContainer = document.getElementById('meme-bg');
  const mqMobile = window.matchMedia('(max-width: 820px)');

  let isMobile = mqMobile.matches;
  let wrappers = [];
  let cycleTimer = null;
  let currentLayout = 0;
  let lastSrcs = [];

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function preloadAll(timeoutMs) {
    const tasks = ALL_MEMES.map(function (m) {
      return new Promise(function (resolve) {
        const img = new Image();
        img.onload = img.onerror = resolve;
        img.decoding = 'async';
        img.src = m.src;
      });
    });
    const timeout = new Promise(function (resolve) {
      setTimeout(resolve, timeoutMs || 2000);
    });
    return Promise.race([Promise.all(tasks), timeout]);
  }

  function buildSlots() {
    bgContainer.textContent = '';
    wrappers = [];
    const count = isMobile ? 5 : 10;

    for (let i = 0; i < count; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'img-wrapper slot-' + i + ' hide';

      const flo = document.createElement('div');
      flo.className = 'meme-float';

      const img = document.createElement('img');
      img.className = 'meme-card';
      img.alt = '';
      img.decoding = 'async';
      img.draggable = false;

      flo.appendChild(img);
      wrap.appendChild(flo);
      bgContainer.appendChild(wrap);
      wrappers.push(wrap);
    }
  }

  function pickMemes(n) {
    let picked = shuffle(ALL_MEMES.slice()).slice(0, n);
    if (lastSrcs.length && picked.every(function (m) { return lastSrcs.indexOf(m.src) > -1; })) {
      picked = shuffle(ALL_MEMES.slice()).slice(0, n);
    }
    lastSrcs = picked.map(function (m) { return m.src; });
    return picked;
  }

  function applyMemes(memes) {
    for (let i = 0; i < wrappers.length; i++) {
      const img = wrappers[i].firstChild.firstChild;
      const m = memes[i % memes.length];
      if (img.getAttribute('data-src') !== m.src) {
        img.src = m.src;
        img.setAttribute('data-src', m.src);
        img.alt = m.alt;
      }
    }
  }

  function nextLayout() {
    wrappers.forEach(function (w) { w.classList.add('hide'); });

    setTimeout(function () {
      currentLayout = (currentLayout + 1) % LAYOUT_COUNT;
      bgContainer.setAttribute('data-layout', String(currentLayout));
      applyMemes(pickMemes(wrappers.length));
      wrappers.forEach(function (w) { w.classList.remove('hide'); });
    }, 350);
  }

  function init() {
    isMobile = mqMobile.matches;
    buildSlots();
    clearInterval(cycleTimer);

    currentLayout = 0;
    bgContainer.setAttribute('data-layout', '0');

    preloadAll(2000).then(function () {
      applyMemes(pickMemes(wrappers.length));
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          wrappers.forEach(function (w) { w.classList.remove('hide'); });
        });
      });
    });

    cycleTimer = setInterval(nextLayout, CYCLE_INTERVAL);
  }

  bgContainer.addEventListener('pointerdown', function (e) {
    const wrap = e.target.closest && e.target.closest('.img-wrapper');
    if (!wrap || wrap.classList.contains('hide')) return;
    wrap.classList.add('active');
    clearTimeout(wrap._t);
    wrap._t = setTimeout(function () {
      wrap.classList.remove('active');
    }, 1400);
  }, { passive: true });

  let resizeTimer = null;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (mqMobile.matches !== isMobile) init();
    }, 300);
  }
  if (mqMobile.addEventListener) mqMobile.addEventListener('change', onResize);
  else if (mqMobile.addListener) mqMobile.addListener(onResize);
  window.addEventListener('orientationchange', onResize, { passive: true });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      clearInterval(cycleTimer);
    } else {
      clearInterval(cycleTimer);
      cycleTimer = setInterval(nextLayout, CYCLE_INTERVAL);
    }
  });

  init();
})();
</script>
</body>
</html>
