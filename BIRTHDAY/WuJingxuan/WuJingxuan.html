<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祝吴靖轩同学生日快乐！</title>
<!-- 中马特色融合图标（已内嵌，无需额外文件） -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23DE2910'/%3E%3Cpath d='M64,64 L0,64 L0,20 Q32,40 64,20 Z' fill='%23010066'/%3E%3Cpolygon points='16,12 18,20 26,20 20,25 22,33 16,28 10,33 12,25 6,20 14,20' fill='%23FFDE00'/%3E%3Cpath d='M40,36 A12,12 0 1,0 56,52 A14,14 0 1,1 40,36 Z' fill='%23FFDE00'/%3E%3Cpolygon points='52,30 53.5,34 57.5,34 54.5,36.5 55.5,40.5 52,38 48.5,40.5 49.5,36.5 46.5,34 50.5,34' fill='%23FFDE00'/%3E%3C/svg%3E">

<style>
  /* 极简高性能 CSS */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh; overflow: hidden;
    /* 整体背景天空渐变：紫粉 -> 橙 -> 黄 */
    background: linear-gradient(to bottom, #3a0ca3 0%, #7209b7 20%, #f72585 45%, #ff9e00 70%, #ffea00 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
  }

  /* ================= 马来西亚夕阳海滩背景 ================= */
  .beach-scene {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }

  /* 太阳 */
  .sun {
    position: absolute; left: 50%; top: 55%;
    width: 25vw; height: 25vw; max-width: 300px; max-height: 300px;
    background: #ffea00;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 40px 15px rgba(255, 158, 0, 0.8), 0 0 100px 40px rgba(247, 37, 133, 0.4);
    animation: sunGlow 3s ease-in-out infinite alternate;
  }
  @keyframes sunGlow { 0% { opacity: 0.9; } 100% { opacity: 1; } }

  /* 海面 */
  .sea {
    position: absolute; bottom: 8%; left: 0; width: 100%; height: 35%;
    background: linear-gradient(to bottom, #0077b6 0%, #03045e 100%);
    opacity: 0.85;
    clip-path: polygon(0 5%, 100% 0, 100% 100%, 0% 100%);
  }

  /* 沙滩 */
  .sand {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 10%;
    background: #e0a96d;
    clip-path: polygon(0 30%, 100% 0, 100% 100%, 0% 100%);
    box-shadow: inset 0 10px 20px rgba(0,0,0,0.2);
  }

  /* 椰子树剪影 (左) */
  .palm-left {
    position: absolute; bottom: 8%; left: 2%;
    width: 150px; height: 250px;
    background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg"><path d="M50 150 Q60 100 40 50 Q35 40 20 30 Q40 25 50 40 Q55 20 80 10 Q60 30 55 50 Q70 45 90 60 Q70 60 55 65 Q75 80 60 100 Q55 80 50 70 Q45 90 20 100 Q40 80 45 65 Z" fill="%23120a1e"/></svg>') no-repeat bottom left;
    background-size: contain;
    opacity: 0.8;
  }

  /* 椰子树剪影 (右) */
  .palm-right {
    position: absolute; bottom: 8%; right: 2%;
    width: 120px; height: 200px;
    background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg"><path d="M50 150 Q60 100 40 50 Q35 40 20 30 Q40 25 50 40 Q55 20 80 10 Q60 30 55 50 Q70 45 90 60 Q70 60 55 65 Q75 80 60 100 Q55 80 50 70 Q45 90 20 100 Q40 80 45 65 Z" fill="%23120a1e"/></svg>') no-repeat bottom right;
    background-size: contain;
    opacity: 0.8;
    transform: scaleX(-1);
  }

  /* ================= 表情包容器 ================= */
  #meme-bg {
    position: fixed; inset: 0;
    z-index: 1; pointer-events: none;
    overflow: hidden;
  }

  .img-wrapper {
    position: absolute;
    transform: translate(-50%, -50%);
    transition: opacity 0.8s ease, transform 0.8s ease, z-index 0s;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    cursor: pointer;
  }
  
  .img-wrapper.hide {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.6);
    pointer-events: none;
  }

  .img-wrapper:hover {
    z-index: 99; 
  }

  .meme-card {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 0 2px rgba(255,255,255,0.3);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    transform: rotate(var(--rot, 0deg)) scale(1.05);
  }
  
  .img-wrapper:not(.hide) .meme-card {
    animation: floatY var(--dur, 3s) ease-in-out infinite alternate;
  }

  .img-wrapper:hover .meme-card {
    animation-play-state: paused;
    transform: rotate(calc(var(--rot, 0deg) + 3deg)) scale(1.35) !important; 
    box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 30px rgba(255, 255, 255, 0.8); 
    z-index: 100;
  }

  @keyframes floatY {
    0% { transform: rotate(var(--rot, 0deg)) scale(1.05) translateY(0); }
    100% { transform: rotate(var(--rot, 0deg)) scale(1.05) translateY(-12px); }
  }

  /* ================= 多彩文字核心区域 ================= */
  .center-content {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    /* 保留微弱的暗色遮罩，来衬托文字的发光效果 */
    background: radial-gradient(circle at center, rgba(20, 10, 30, 0.6) 0%, rgba(20, 10, 30, 0.3) 40%, transparent 70%);
    padding: 0 10%;
    pointer-events: none;
  }

  .cake { 
    font-size: clamp(40px, 8vw, 70px); 
    margin-bottom: 10px; 
    animation: bounce 1.5s infinite alternate; 
    filter: drop-shadow(0 0 15px rgba(255, 234, 0, 0.9));
  }
  @keyframes bounce { 
    0% { transform: translateY(0) scale(1); } 
    100% { transform: translateY(-10px) scale(1.1); } 
  }

  /* 主标题：彩虹流光效果 + 强烈白色发光 */
  .title-my {
    font-size: clamp(2.2rem, 5vw, 4.5rem);
    font-weight: 900;
    line-height: 1.2;
    background: linear-gradient(90deg, #ff79c6, #ffb86c, #f1fa8c, #50fa7b, #8be9fd, #bd93f9, #ff79c6);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbowFlow 3s linear infinite;
    /* 去除黑影，改为纯白+粉色的光晕 */
    filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 25px rgba(255, 121, 198, 0.7));
  }
  @keyframes rainbowFlow {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
  
  /* 中文大字：粉色霓虹发光 */
  .title-cn {
    font-size: clamp(1.2rem, 2.8vw, 2rem);
    font-weight: bold; 
    color: #ffb8d2;
    margin-top: 10px; 
    letter-spacing: 2px;
    /* 纯发光，无偏移黑影 */
    text-shadow: 0 0 10px #ffb8d2, 0 0 20px #ff79c6, 0 0 30px #ff79c6;
  }

  /* 留学生马来语祝福：青色霓虹发光 */
  .sub-my {
    font-size: clamp(0.95rem, 2vw, 1.25rem);
    color: #8be9fd; 
    margin-top: 25px; 
    line-height: 1.6;
    font-weight: 500;
    text-shadow: 0 0 10px #8be9fd, 0 0 20px #8be9fd;
  }

  /* 留学生中文祝福：绿色霓虹发光 */
  .sub-cn {
    font-size: clamp(0.9rem, 1.8vw, 1.15rem);
    color: #50fa7b; 
    margin-top: 8px; 
    line-height: 1.6;
    font-weight: bold;
    text-shadow: 0 0 10px #50fa7b, 0 0 20px #50fa7b;
  }

  /* 俏皮的悄悄话注语：黄色霓虹发光 */
  .note {
    margin-top: 30px;
    font-size: clamp(0.9rem, 1.5vw, 1.1rem);
    color: #ffea00;
    font-weight: 500;
    opacity: 0.95;
    font-style: italic;
    letter-spacing: 1px;
    text-shadow: 0 0 10px #ffea00, 0 0 20px #ffea00;
  }

  /* 底部醒目祝福语：混合光晕 */
  .footer {
    position: fixed; bottom: 4%; left: 0; right: 0;
    z-index: 20; text-align: center;
    font-size: clamp(1.4rem, 3.5vw, 2.2rem);
    font-weight: 900;
    background: linear-gradient(45deg, #fff, #f1fa8c, #ffb86c, #fff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: pulse 1s infinite alternate, rainbowFlow 3s linear infinite;
    /* 外层白色+浅黄色发光 */
    filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 20px rgba(241, 250, 140, 0.8));
    pointer-events: none;
  }
  @keyframes pulse { 
    0% { transform: scale(1); } 
    100% { transform: scale(1.05); } 
  }
</style>
</head>
<body>

  <!-- 海滩、夕阳与椰子树背景 -->
  <div class="beach-scene">
    <div class="sun"></div>
    <div class="sea"></div>
    <div class="sand"></div>
    <div class="palm-left"></div>
    <div class="palm-right"></div>
  </div>

  <!-- 表情包容器 -->
  <div id="meme-bg"></div>

  <!-- 居中文字区 -->
  <div class="center-content">
    <div class="cake">🎂</div>
    <div class="title-my">Selamat Hari Jadi!</div>
    
    <div class="title-cn">祝吴靖轩同学生日快乐！</div>
    
    <div class="sub-my">Semoga cepat adaptasi dengan universiti, cemerlang dalam akademik, jumpa kawan yang baik, dan sentiasa gembira!</div>
    <div class="sub-cn">愿你在大学新生活中早日适应，逢考必过，结识挚友，天天开心，勇敢追梦！</div>
    
    <div class="note">感觉你好像特别喜欢人民的名义，希望你喜欢这个:D</div>
  </div>

  <div class="footer">✨ 来自计62的生日祝福 ✨</div>

<script>
  const allMemes = [
    { src: '1.jpg', alt: '请开始你的表演' },
    { src: '2.jpg', alt: '来自达康的凝视' },
    { src: '3.jpg', alt: '高兴到只剩下双眼皮' },
    { src: '4.jpg', alt: '谁的眼神锁定我' },
    { src: '5.jpg', alt: '高兴到模糊' },
    { src: '6.jpg', alt: '你夸的人在这儿呐' },
    { src: '7.jpg', alt: '下面我简单说两句' },
    { src: '8.webp', alt: '放学别跑' },
    { src: '9.jpg', alt: '出来玩儿' },
    { src: '10.jpg', alt: 'show出你的苹果肌' },
    { src: '11.jpg', alt: '达康书记别低头GDP会掉' },
    { src: '12.jpg', alt: '老师我想进步了' },
    { src: '13.jpg', alt: '面壁思过' },
    { src: '14.jpg', alt: '你千万别拔腿就跑' }
  ];

  const bgContainer = document.getElementById('meme-bg');
  const SLOT_COUNT = 10; 
  const wrappers = [];

  const POS_TEMPLATES = [
    [12, 15, 18, 20], [25, 8, 15, 18], [8, 45, 20, 22], [20, 75, 18, 20], [5, 85, 16, 18],
    [88, 15, 18, 20], [75, 8, 15, 18], [92, 45, 20, 22], [80, 75, 18, 20], [95, 85, 16, 18],
    [15, 30, 12, 15], [85, 30, 12, 15], [15, 65, 12, 15], [85, 65, 12, 15]
  ];

  function initDOM() {
    for (let i = 0; i < SLOT_COUNT; i++) {
      const wrapper = document.createElement('div');
      wrapper.className = 'img-wrapper hide';
      const img = document.createElement('img');
      img.className = 'meme-card';
      wrapper.appendChild(img);
      bgContainer.appendChild(wrapper);
      wrappers.push(wrapper);
    }
  }

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex !== 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function randomizeMemes() {
    const shuffledMemes = shuffle([...allMemes]).slice(0, SLOT_COUNT);
    const shuffledPos = shuffle([...POS_TEMPLATES]).slice(0, SLOT_COUNT);

    wrappers.forEach(wrapper => wrapper.classList.add('hide'));

    setTimeout(() => {
      wrappers.forEach((wrapper, index) => {
        const img = wrapper.querySelector('img');
        img.src = shuffledMemes[index].src;
        img.alt = shuffledMemes[index].alt;

        let [leftPct, topPct, widthVw, heightVh] = shuffledPos[index];

        leftPct += (Math.random() * 16 - 8); 
        topPct += (Math.random() * 16 - 8);  
        widthVw = widthVw * (0.8 + Math.random() * 0.5);

        wrapper.style.left = `${leftPct}%`;
        wrapper.style.top = `${topPct}%`;
        wrapper.style.width = `${widthVw}vw`;
        wrapper.style.height = `${heightVh}vh`;

        const randomDeg = (Math.random() * 40 - 20).toFixed(1);
        wrapper.style.setProperty('--rot', `${randomDeg}deg`);
        
        const randomDur = (2.5 + Math.random() * 2).toFixed(1) + 's';
        wrapper.style.setProperty('--dur', randomDur);

        wrapper.classList.remove('hide');
      });
    }, 600); 
  }

  initDOM();
  setTimeout(randomizeMemes, 100);
  setInterval(randomizeMemes, 6000);
</script>
</body>
</html>
